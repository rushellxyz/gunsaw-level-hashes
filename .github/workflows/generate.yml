name: Auto Update Hashes

on:
  schedule:
    - cron: '0 */2 * * *' # 2 hours

  workflow_dispatch:

permissions:
  contents: write

env:
  UPSTREAM_REPO: https://github.com/jimmyking9999999/gunsaw-level-editor-plus.git

jobs:
  update-files:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check upstream commit
        id: upstream
        shell: bash
        run: |
          CURRENT_SHA=$(git ls-remote "$UPSTREAM_REPO" HEAD | cut -f1)

          if [ -z "$CURRENT_SHA" ]; then
            echo "Failed to get upstream SHA"
            exit 1
          fi

          echo "Current upstream SHA: $CURRENT_SHA"

          if [ -f .github/upstream-sha ]; then
            LAST_SHA=$(cat .github/upstream-sha)
          else
            LAST_SHA=""
          fi

          echo "Previous upstream SHA: $LAST_SHA"

          if [ "$CURRENT_SHA" = "$LAST_SHA" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new commits."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "sha=$CURRENT_SHA" >> "$GITHUB_OUTPUT"
            echo "New commit detected!"
          fi

      - name: Set up Python
        if: steps.upstream.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        if: steps.upstream.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: python -m pip install requests

      - name: Run hash generator script
        if: steps.upstream.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: python generate.py

      - name: Save upstream commit
        if: steps.upstream.outputs.changed == 'true'
        run: |
          mkdir -p .github
          echo "${{ steps.upstream.outputs.sha }}" > .github/upstream-sha

      - name: Commit and push changes
        if: steps.upstream.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add hashes.txt .github/upstream-sha

          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Update hashes"
            git push
          fi
